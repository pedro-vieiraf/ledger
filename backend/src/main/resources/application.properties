spring.application.name=ledger

# Database connection
# Defaults for running the application directly from the IDE.
# Docker Compose overrides these values through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ledger}

# JPA and Hibernate
# Development configuration: create missing tables and update the schema.
spring.jpa.hibernate.ddl-auto=update

# Hibernate does not update existing check constraints when an enum gains a
# new value, so schema.sql must run after the EntityManagerFactory is ready.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# SQL logging for local development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep database access explicit in the application layer.
spring.jpa.open-in-view=false

# Recurrence scheduler. The application is expected to run as a backend
# service, so due occurrences are generated even when the mobile app is closed.
ledger.recurrence.scheduler-enabled=${LEDGER_RECURRENCE_SCHEDULER_ENABLED:true}
ledger.recurrence.scheduler-delay-ms=${LEDGER_RECURRENCE_SCHEDULER_DELAY_MS:60000}
ledger.recurrence.scheduler-initial-delay-ms=${LEDGER_RECURRENCE_SCHEDULER_INITIAL_DELAY_MS:15000}
ledger.recurrence.zone-id=${LEDGER_RECURRENCE_ZONE_ID:America/Sao_Paulo}