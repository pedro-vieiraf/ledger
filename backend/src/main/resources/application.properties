spring.application.name=ledger

# Database connection
# Defaults for running the application directly from the IDE.
# Docker Compose overrides these values through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ledger}

# JPA and Hibernate
# Development configuration: create missing tables and update the schema.
spring.jpa.hibernate.ddl-auto=update

# SQL logging for local development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep database access explicit in the application layer.
spring.jpa.open-in-view=false